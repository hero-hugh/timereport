server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (försvar mot clickjacking, MIME-sniff, XSS, info-leak)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://timereport-backend.app.svens.tech; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # Scanner-botar sonderar efter PHP/ASP-shells. Utan detta fångas de av
    # SPA-fallbacken nedan och får tillbaka index.html med status 200.
    #
    # 404, inte 444: den här servern körs bakom CapRovers nginx. 444 stänger
    # kopplingen utan svar, vilket proxyn framför tolkar som en trasig upstream
    # och översätter till 502 — plus en felrad i dess errorlog per bot-request.
    # 444 hör hemma i den yttersta nginxen, som pratar direkt med klienten.
    location ~* \.(php|phtml|php[0-9]|asp|aspx|jsp|cgi|sh|bak|env|sql)$ {
        access_log off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
