name: CI

on:
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
        working-directory: .

      - name: Generate Prisma clients
        run: npm run db:generate:all

      - name: Run tests
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run db:generate:all
        working-directory: apps/api

      - name: Create API env file
        run: |
          printf '%s\n' \
            'AUTH_DATABASE_URL="file:./data/auth.db"' \
            'USER_DATABASE_URL="file:./data/placeholder.db"' \
            'DATABASE_DIR="./data"' \
            'JWT_SECRET="ci-test-secret-must-be-at-least-32-characters"' \
            'JWT_REFRESH_SECRET="ci-test-refresh-secret-must-be-32-chars"' \
            'TOKEN_ENCRYPTION_KEY="dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ="' \
            'FRONTEND_URL="http://localhost:5173"' \
            > apps/api/.env.local

      - name: Set up databases
        run: |
          npm run db:push:auth
          npm run db:push:user
        working-directory: apps/api
        env:
          AUTH_DATABASE_URL: "file:./data/auth.db"
          USER_DATABASE_URL: "file:./data/placeholder.db"

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          E2E_TEST_OTP: "000000"
          NODE_ENV: "test"
          AUTH_DATABASE_URL: "file:./data/auth.db"
          USER_DATABASE_URL: "file:./data/placeholder.db"
          DATABASE_DIR: "./data"
          JWT_SECRET: "ci-test-secret-must-be-at-least-32-characters"
          JWT_REFRESH_SECRET: "ci-test-refresh-secret-must-be-32-chars"
          TOKEN_ENCRYPTION_KEY: "dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHR0dHQ="
          FRONTEND_URL: "http://localhost:5173"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  image-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed synthetic files to verify recursive exclusions
        run: |
          for directory in apps/api/src/security-canary apps/web/public/security-canary; do
            mkdir -p "$directory"
            for file in .env.local auth.db auth.db-wal private.key; do
              printf '%s\n' 'synthetic-security-canary' > "$directory/$file"
            done
          done

      - name: Build application images
        run: |
          docker build --pull --target builder -f Dockerfile.api -t time-report-api-builder:ci .
          docker build --pull --target builder -f Dockerfile.web -t time-report-web-builder:ci .
          docker build --pull -f Dockerfile.api -t time-report-api:ci .
          docker build --pull -f Dockerfile.web -t time-report-web:ci .

      - name: Reject embedded databases and secrets
        run: |
          sh docker/check-image.sh time-report-api-builder:ci
          sh docker/check-image.sh time-report-web-builder:ci
          sh docker/check-image.sh time-report-api:ci
          sh docker/check-image.sh time-report-web:ci

      - name: Verify unprivileged API startup
        run: sh docker/check-runtime.sh time-report-api:ci
